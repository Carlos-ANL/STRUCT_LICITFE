name: contratos-menores-ferreteria-epp
on:
  schedule:
    # Hora Lima (UTC-5): 11:00 am, 5:00 pm y 9:00 pm
    - cron: "0 16 * * *"   # 11:00 am Lima
    - cron: "0 22 * * *"   # 5:00 pm Lima
    - cron: "0 2 * * *"    # 9:00 pm Lima
  workflow_dispatch:
concurrency:
  group: contratos-menores
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python contratos_menores.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar vistos
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_ferreteria.json
          if ! git diff --staged --quiet; then
            git commit -m "update seen"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep 5
            done
            echo "No se pudo guardar seen_ferreteria.json"
            exit 1
          fi
